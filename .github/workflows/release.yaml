name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "固定 tag；重复运行会覆盖该 release 的资产与说明（不做版本号语义）"
        required: true
        default: "rolling"
      title:
        description: "Release 标题"
        required: false
        default: "Komodo Rolling Build"
      notes:
        description: "Release 说明（留空则自动生成 commit + 构建时间）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.14"

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Build core, periphery, km
        run: mise run build-binaries

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release-publish -- "${{ github.event.inputs.tag }}" --title "${{ github.event.inputs.title }}" --notes "${{ github.event.inputs.notes }}"
